services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DB_FILE: /data/db/db.sqlite3
    volumes:
      - ./links.txt:/app/links.txt
      - db_data:/data/db
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      LINKS_FILE: /data/links.txt
      ENV_FILE:   /data/.env
      DB_FILE:    /data/db/db.sqlite3
    volumes:
      - ./links.txt:/data/links.txt
      - ./.env:/data/.env
      - db_data:/data/db
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    restart: unless-stopped

volumes:
  db_data:
